name: Update ED news

on:
  schedule:
    - cron: "17 */2 * * *"   # har 2 ghante (UTC)
  workflow_dispatch:          # Actions tab se haath se bhi chala sakte hain

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest news
        run: python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "ed-khabar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news.json story sitemap.xml
          git diff --staged --quiet || (git commit -m "News update $(date -u +'%Y-%m-%d %H:%M')" && git push)
